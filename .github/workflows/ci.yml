name: ConTrackPro CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend Laravel Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: contrackpro_testing
          MYSQL_USER: contrackpro
          MYSQL_PASSWORD: contrackpro
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucontrackpro -pcontrackpro"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: contrackpro_testing
      DB_USERNAME: contrackpro
      DB_PASSWORD: contrackpro
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, pdo_mysql, xml, ctype, curl, zip, gd
          coverage: none
          tools: composer

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear

      - name: Run test database migrations
        run: php artisan migrate:fresh --force

      - name: Create Passport keys and personal client
        run: |
          php artisan passport:keys --force
          php artisan passport:client --personal --name="ConTrackPro Personal Access Client" --no-interaction

      - name: Run backend tests
        run: php artisan test

      - name: Verify seeders run successfully
        run: php artisan migrate:fresh --seed --force

  frontend:
    name: Frontend Vue Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "16"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: ${{ github.event_name == 'push' && vars.CD_ENABLED == 'true' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node for Railway CLI
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_BACKEND_SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_BACKEND_SERVICE" ] || [ -z "$RAILWAY_ENVIRONMENT" ]; then
            echo "Missing Railway deployment configuration. Set RAILWAY_TOKEN secret and RAILWAY_PROJECT_ID, RAILWAY_BACKEND_SERVICE, RAILWAY_ENVIRONMENT variables in the GitHub environment."
            exit 1
          fi

          railway up backend \
            --path-as-root \
            --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_BACKEND_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: ${{ github.event_name == 'push' && vars.CD_ENABLED == 'true' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel deployment configuration. Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets in the GitHub environment."
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
